<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Registration - SafeHealth</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="min-height: 100vh;">
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7">
            <div class="text-center mb-4">
                <a href="/" class="text-decoration-none d-inline-flex align-items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="currentColor" class="bi bi-shield-plus text-primary" viewBox="0 0 16 16">
                        <path d="M5.338 1.59a6.1 6.1 0 0 0-2.837.856.48.48 0 0 0-.24.41v4.23c0 2.62 1.411 4.964 3.69 6.066L8 14.1l2.05-1a6 6 0 0 0 3.69-6.067V2.856a.48.48 0 0 0-.24-.41 6 6 0 0 0-2.837-.856L8 1.05zM8 0c1.49 0 2.862.36 4.054.991a1.48 1.48 0 0 1 .772 1.295V6.82c0 3.304-1.921 6.257-4.992 7.493a1.48 1.48 0 0 1-1.11 0C3.629 13.076 1.708 10.123 1.708 6.82V2.286c0-.528.272-1.01.772-1.295C3.67 0.361 5.04 0 8 0z"/>
                        <path d="M8 4.5a.5.5 0 0 1 .5.5v1.5H10a.5.5 0 0 1 0 1H8.5V9a.5.5 0 0 1-1 0V7.5H6a.5.5 0 0 1 0-1h1.5V5a.5.5 0 0 1 .5-.5z"/>
                    </svg>
                    <span class="fs-4 fw-bold text-primary">SafeHealth</span>
                </a>
            </div>
            <div class="custom-card">
                <h2 class="text-center mb-3">Create Patient Account</h2>
                <p class="text-secondary text-center small mb-4">Register your decentralized healthcare vault to secure and share medical records.</p>
                
                {% if msg %}
                <div class="alert alert-info text-center small">{{ msg }}</div>
                {% endif %}
                
                <form method="post" action="/PatientRegisterAction">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="t1" class="form-label">Full Name</label>
                            <input type="text" class="form-control" id="t1" name="t1" required placeholder="Enter full name"/>
                        </div>
                        <div class="col-md-6">
                            <label for="t2" class="form-label">Gender</label>
                            <select class="form-select" id="t2" name="t2" required>
                                <option value="" disabled selected>Select Gender</option>
                                <option value="Male">Male</option>
                                <option value="Female">Female</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label for="t3" class="form-label">Date of Birth</label>
                            <input type="date" class="form-control" id="t3" name="t3" required/>
                        </div>
                        <div class="col-md-6">
                            <label for="t4" class="form-label">Contact Number</label>
                            <input type="tel" class="form-control" id="t4" name="t4" required placeholder="e.g. +1 (555) 000-0000"/>
                        </div>
                        <div class="col-md-12">
                            <label for="t5" class="form-label">Address</label>
                            <input type="text" class="form-control" id="t5" name="t5" required placeholder="Street address, City, Country"/>
                        </div>
                        <div class="col-md-6">
                            <label for="t6" class="form-label">Username</label>
                            <input type="text" class="form-control" id="t6" name="t6" required placeholder="Choose a username"/>
                        </div>
                        <div class="col-md-6">
                            <label for="t7" class="form-label">Password</label>
                            <input type="password" class="form-control" id="t7" name="t7" required placeholder="Choose a password"/>
                        </div>
                    </div>
                    
                    <button type="submit" class="btn btn-primary w-100 py-2 mt-4">Register Account</button>
                </form>
                
                <div class="text-center mt-3">
                    <p class="small text-secondary mb-0">Already registered? <a href="/PatientLogin" class="text-primary fw-medium text-decoration-none">Sign In</a></p>
                </div>
                
                <div class="text-center mt-4 border-top pt-3">
                    <a href="/" class="text-secondary small text-decoration-none d-inline-flex align-items-center gap-1">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-arrow-left" viewBox="0 0 16 16">
                            <path fill-rule="evenodd" d="M15 8a.5.5 0 0 0-.5-.5H2.707l3.147-3.146a.5.5 0 1 0-.708-.708l-4 4a.5.5 0 0 0 0 .708l4 4a.5.5 0 0 0 .708-.708L2.707 8.5H14.5A.5.5 0 0 0 15 8"/>
                        </svg>
                        Back to Landing Page
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/script.js"></script>
</body>
</html>
